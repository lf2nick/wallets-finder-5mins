# wallets-finder-5mins — local Docker compose
#
# 跟 poly-tracker 共用 crypto-db (host port 5433)。
# 容器內 DB_HOST 必須是 host.docker.internal，否則連不到 host 上的 postgres。
# EC2 部署用 docker-compose.ec2.yml override。

services:
  wf5m-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wf5m-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      HTTP_ADDR: ":8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  wf5m-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wf5m-frontend
    restart: unless-stopped
    depends_on:
      - wf5m-backend
    ports:
      # 避開 poly-tracker-frontend (3001) / polybot-frontend (3000)
      - "3002:80"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
